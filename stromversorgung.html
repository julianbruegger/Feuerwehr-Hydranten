<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Stromversorgung – Trafostationen & Umspannwerke auf der Karte" />
  <title>⚡ Stromversorgung</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <div class="topbar__logo">
      <span class="topbar__icon">⚡</span>
      <span class="topbar__title">Stromversorgung</span>
    </div>
    <div class="topbar__status" id="statusBadge">
      <span class="topbar__status-dot"></span>
      <span id="statusText">Standort ermitteln…</span>
    </div>
  </header>

  <!-- ===== FULL-SCREEN MAP ===== -->
  <main class="map-container">
    <div id="map"></div>

    <!-- Floating action buttons (right side) -->
    <div class="fab-group">
      <!-- Back to hydrant map -->
      <button class="fab" id="btnHydranten" onclick="window.location.href='index.html'"
        title="Hydrantennavigator" aria-label="Zu Hydranten wechseln">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <button class="fab" id="btnMyLocation" title="Meinen Standort zentrieren" aria-label="Meinen Standort zentrieren">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
        </svg>
      </button>
      <button class="fab fab--map" id="btnBasemap" title="Swisstopo / OSM wechseln" aria-label="Kartenebene wechseln">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/>
        </svg>
      </button>
      <button class="fab" id="btnToggleAll" title="Alle Trafostationen anzeigen" aria-label="Alle Trafostationen anzeigen">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/>
        </svg>
      </button>
      <button class="fab fab--refresh" id="btnRefresh" title="Trafostationen neu laden" aria-label="Trafostationen neu laden">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
        </svg>
      </button>
    </div>
    <!-- Location alert (shown when GPS unavailable or denied) -->
    <div class="location-alert" id="locationAlert" hidden>
      <span class="location-alert__text" id="locationAlertText">Standort nicht verfügbar</span>
      <button class="location-alert__btn" id="btnLocationRetry">Erneut versuchen</button>
    </div>
  </main>

  <!-- ===== BOTTOM SHEET ===== -->
  <section class="bottom-sheet collapsed" id="bottomSheet" aria-label="Trafostationen-Details">
    <div class="sheet-handle" id="sheetHandle" role="button" aria-label="Sheet öffnen/schließen"></div>

    <!-- Settings row -->
    <div class="sheet-settings">
      <label class="setting-label" for="searchRadius">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
        </svg>
        Radius (m)
      </label>
      <input type="number" id="searchRadius" class="setting-input" value="2000" min="200" max="5000" step="100"
        inputmode="numeric" aria-label="Suchradius in Metern" />
    </div>

    <!-- Substation list -->
    <div class="sheet-content" id="sheetContent">
      <div class="empty-state" id="emptyState">Suche wird gestartet…</div>
      <ul class="hydrant-list" id="substationList" aria-label="Trafostationen-Liste" hidden></ul>
    </div>
  </section>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="stromversorgung.js"></script>
</body>

</html>
