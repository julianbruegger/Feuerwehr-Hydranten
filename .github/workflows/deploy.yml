name: Deploy to Hostpoint

on:
  workflow_run:
    workflows:
      - Checks
    branches:
      - main
    types:
      - completed

jobs:
  build-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: Hostpoint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTPOINT_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HOSTPOINT_HOST }} >> ~/.ssh/known_hosts

      - name: Generate config/db.php from secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          # Mail: MAIL_* are the primary secret names; SMTP_* are accepted as fallbacks.
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          # Resolve mail settings: prefer MAIL_*, fall back to SMTP_*, then sensible defaults.
          HOST_VAL="${MAIL_HOST:-$SMTP_HOST}"
          USER_VAL="${MAIL_USER:-$SMTP_USER}"
          PASS_VAL="${MAIL_PASS:-$SMTP_PASS}"
          FROM_VAL="${SMTP_FROM:-$USER_VAL}"
          BASE_URL_VAL="${APP_BASE_URL:-https://feuerwehr.julian-bruegger.ch}"
          {
            echo "<?php"
            printf "define('DB_HOST',             '%s');\n" "$DB_HOST"
            printf "define('DB_NAME',             '%s');\n" "$DB_NAME"
            printf "define('DB_USER',             '%s');\n" "$DB_USER"
            printf "define('DB_PASS',             '%s');\n" "$DB_PASS"
            echo "define('DB_CHARSET',          'utf8mb4');"
            printf "define('ADMIN_PASSWORD_HASH', '%s');\n" "$ADMIN_PASSWORD_HASH"
            echo "define('SESSION_LIFETIME',    3600);"
            echo "define('APP_NAME',            'Hydrantennavigator Admin');"
            # ── Mail (SMTP) — optional. If the host is empty the app logs links to cache/mail.log instead. ──
            printf "define('SMTP_HOST',           '%s');\n" "$HOST_VAL"
            printf "define('SMTP_PORT',           %s);\n"   "${SMTP_PORT:-587}"
            printf "define('SMTP_USER',           '%s');\n" "$USER_VAL"
            printf "define('SMTP_PASS',           '%s');\n" "$PASS_VAL"
            printf "define('SMTP_SECURE',         '%s');\n" "${SMTP_SECURE:-tls}"
            printf "define('SMTP_FROM',           '%s');\n" "$FROM_VAL"
            printf "define('SMTP_FROM_NAME',      '%s');\n" "${SMTP_FROM_NAME:-Hydrantennavigator}"
            printf "define('APP_BASE_URL',        '%s');\n" "$BASE_URL_VAL"
          } > config/db.php

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude 'Hostpoint Quarantined Files' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            -e "ssh -i ~/.ssh/deploy_key -o MACs=hmac-sha2-256 -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.HOSTPOINT_USER }}@${{ secrets.HOSTPOINT_HOST }}:/home/ataciden/www/feuerwehr.julian-bruegger.ch/